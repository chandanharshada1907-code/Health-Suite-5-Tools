<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | BMI & Health Calculator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="custom-card shadow-lg" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
        <i class="fas fa-user-shield"></i>
      </div>
      <h3 class="fw-extrabold text-main mb-1">Admin Portal</h3>
      <p class="text-muted fs-7">BMI & Health Calculator Management</p>
    </div>

    <form onsubmit="event.preventDefault(); window.location.href='admin.html';">
      <div class="mb-3">
        <label class="form-label fs-7 fw-semibold">Administrator ID / Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
          <input type="text" class="form-control" value="admin@dmproject.edu" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fs-7 fw-semibold">Access Key / Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" class="form-control" value="••••••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
        <i class="fas fa-right-to-bracket me-1"></i> Sign In to Admin Console
      </button>

      <div class="text-center">
        <a href="dashboard.html" class="fs-7 text-muted text-decoration-none">
          <i class="fas fa-arrow-left me-1"></i> Return to Main Application
        </a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
